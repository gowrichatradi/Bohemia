<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Arctic → Alpine</title>
<meta name="theme-color" content="#0D1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arctic → Alpine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<style>
:root{
  --bg:#0B0F13; --bg2:#121A20; --card:#161F25; --card2:#1D282F; --line:#26333A;
  --ink:#F2F5F6; --ink2:#95A6AD; --ink3:#5F727A;
  --dawn:#4FD69C; --dusk:#E8A860; --fjord:#6BB6CE; --alpine:#9FD8D2;
  --warn:#E8735A; --gold:#D9A441; --bohemia:#D9A441; --kid:#B79AE6;
  --accent:var(--fjord);
  --sys:'Inter',-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --serif:'Inter',-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,monospace;
  --safe-t:env(safe-area-inset-top);
  --safe-b:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.5,.05,.1,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sys);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;
  font-feature-settings:"ss01","cv11";
}
/* fixed backdrop glow — a hint of sky behind everything.
   #4 the sky's colour comes from CSS vars set by JS every 10 minutes
   based on the current hour of the day at the destination */
body{
  --sky-a:rgba(79,214,156,.13);   /* top-left glow, default: dawn/aurora green */
  --sky-b:rgba(107,182,206,.10);  /* top-right glow, default: fjord blue */
  --sky-c:rgba(217,164,65,.06);   /* bottom-center warm */
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  transition:background 4s ease;
  background:
    radial-gradient(140% 65% at 12% -8%, var(--sky-a), transparent 60%),
    radial-gradient(120% 55% at 92% 2%, var(--sky-b), transparent 55%),
    radial-gradient(90% 55% at 50% 105%, var(--sky-c), transparent 60%);
}
#app{padding:calc(var(--safe-t) + 8px) 0 calc(82px + var(--safe-b))}
.wrap{padding:0 18px;max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  transition:transform .12s var(--ease)}
button:active{transform:scale(.975)}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:40;background:rgba(11,15,19,.8);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(var(--safe-t) + 10px) 18px 0;border-bottom:.5px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-bottom:10px}
.top h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:-.02em}
.top .sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin-top:2px}
.top button{color:var(--ink3)}
/* progress ring in the top bar */
.pring{position:relative;width:34px;height:34px;flex:0 0 34px}
.pring svg{width:34px;height:34px;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:2.5}
.pring .pr-bg{stroke:var(--line)}
.pring .pr-fg{stroke:url(#pgrad);stroke-linecap:round;
  transition:stroke-dashoffset 1s var(--ease)}
.pring .pr-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9px;color:var(--ink2);letter-spacing:.03em;font-weight:500}
.srch{width:100%;background:var(--card);border:.5px solid var(--line);border-radius:11px;
  padding:10px 12px;font-size:15px;color:var(--ink);margin-bottom:10px;outline:none;
  transition:border-color .2s,box-shadow .2s}
.srch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(107,182,206,.12)}
.srch::placeholder{color:var(--ink3)}
/* trip progress hairline under the bar */
.prog{position:relative;height:2px;background:transparent;max-width:640px;margin:0 auto}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--dawn),var(--fjord) 55%,var(--gold));
  transition:width 1s var(--ease)}

/* ===== tab bar ===== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(11,15,19,.9);backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:.5px solid var(--line);padding-bottom:var(--safe-b)}
.nav-in{position:relative;max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab-ind{position:absolute;top:0;height:2px;width:25%;left:0;
  transform:translateX(calc(var(--tab-i,0)*100%));
  transition:transform .36s var(--ease)}
.tab-ind::after{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:34px;height:2px;border-radius:2px;background:var(--dawn);
  box-shadow:0 0 10px rgba(79,214,156,.7)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;
  color:var(--ink3);font-size:10px;letter-spacing:.01em;transition:color .2s}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.tab.on{color:var(--dawn)}
.tab.on svg{transform:translateY(-1px) scale(1.06)}

/* ===== hero ===== */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px;margin:14px 0;
  background:linear-gradient(155deg,#1B2A32 0%,#141F26 58%,#121A20 100%);
  border:.5px solid var(--line);
  box-shadow:0 24px 60px -30px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.03) inset}
/* #7 region-color signature stripe at the very top of every hero */
.hero::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent 0%,var(--accent) 15%,var(--accent) 85%,transparent 100%);
  opacity:.85;pointer-events:none;z-index:2;
  box-shadow:0 0 12px color-mix(in srgb,var(--accent) 55%,transparent)}
/* hero cover photo layer — see #1 */
.hero-cover{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.2s var(--ease)}
.hero.has-cover .hero-cover{opacity:.7}
.hero.has-cover{min-height:220px}
.hero.has-cover::before{opacity:.85;
  background:
    radial-gradient(70% 100% at 20% 100%, rgba(11,15,19,.95), transparent 65%),
    linear-gradient(180deg, rgba(11,15,19,.15) 0%, rgba(11,15,19,.35) 40%, rgba(11,15,19,.9) 90%)}
.hero.has-cover .scene{opacity:.15}
.hero.has-cover .eyebrow,.hero.has-cover .stay{text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hero.has-cover h2{text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:150%;z-index:0;
  pointer-events:none;opacity:.6;
  background:
    radial-gradient(50% 60% at 20% 0%, color-mix(in srgb,var(--accent) 42%,transparent), transparent 70%),
    radial-gradient(45% 55% at 82% 8%, color-mix(in srgb,var(--dawn) 30%,transparent), transparent 70%);
  filter:blur(6px);animation:aurora 14s ease-in-out infinite alternate}
.hero>*{position:relative;z-index:1}
@keyframes aurora{
  0%{transform:translate3d(-4%,0,0) scale(1.05);opacity:.5}
  50%{transform:translate3d(3%,2%,0) scale(1.12);opacity:.7}
  100%{transform:translate3d(6%,-1%,0) scale(1.06);opacity:.55}
}
.hero .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dusk);display:flex;align-items:center;gap:8px}
.hero .leg-tag{color:var(--accent)}
.hero .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
.hero h2{font-family:var(--serif);font-size:26px;line-height:1.2;margin:12px 0 16px;
  letter-spacing:-.02em;font-weight:600;color:var(--ink)}
.hero .cd{font-family:var(--serif);font-size:88px;font-weight:800;line-height:.95;
  letter-spacing:-.05em;margin:14px 0 6px;
  color:var(--ink);
  display:inline-block}
.hero .cd small{font-size:15px;font-weight:400;color:var(--ink2);letter-spacing:.02em;
  -webkit-text-fill-color:var(--ink2);display:block;margin-top:6px;
  font-family:var(--mono);text-transform:uppercase}
.hero .stay{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink3);
  margin-top:13px;display:flex;align-items:center;gap:7px}
.hero .stay svg{width:14px;height:14px;flex:0 0 14px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.hero .stay b{color:var(--ink2);font-weight:500}
.hero .scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:108px;z-index:0;
  color:var(--accent);opacity:.5;pointer-events:none;
  -webkit-mask-image:linear-gradient(to top,#000 58%,transparent);mask-image:linear-gradient(to top,#000 58%,transparent)}

/* ===== chips ===== */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.07em;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);
  color:var(--ink2);white-space:nowrap;border:.5px solid transparent}
.chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.chip.car{background:rgba(217,164,65,.15);color:var(--gold)}
.chip.nocar{opacity:.5}
.chip.fly{background:rgba(232,168,96,.16);color:var(--dusk)}
.chip.rail{background:rgba(79,214,156,.14);color:var(--dawn)}
.chip.rise{background:rgba(79,214,156,.12);color:var(--dawn)}
.chip.set{background:rgba(232,168,96,.12);color:var(--dusk)}
.chip.drive{background:rgba(255,255,255,.05);color:var(--ink2)}
.chip.sun{background:rgba(255,255,255,.05);padding:5px 4px;flex-wrap:nowrap;white-space:nowrap;
  display:inline-flex;align-items:center;gap:0}
.chip.sun .s-r,.chip.sun .s-s{display:inline-flex;align-items:center;gap:4px;padding:0 8px;white-space:nowrap}
.chip.sun .s-r{color:var(--dawn);border-right:.5px solid rgba(255,255,255,.1)}
.chip.sun .s-s{color:var(--dusk)}
button.chip{transition:transform .12s var(--ease),background .2s}
button.chip:active{transform:scale(.95)}

/* ===== cards ===== */
.card{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;
  box-shadow:0 12px 30px -18px rgba(0,0,0,.5)}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.lab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.muted{color:var(--ink2);font-size:15px}
.tiny{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink3)}

/* ===== day list w/ legs ===== */
.leg{margin-top:22px}
.leg:first-child{margin-top:6px}
.leghd{display:flex;align-items:baseline;gap:10px;padding:0 2px 10px;
  border-bottom:.5px solid var(--line);margin-bottom:4px}
.leghd .bar{width:3px;height:15px;border-radius:2px;background:var(--accent);align-self:center;
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.leghd .nm{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.015em}
.leghd .sb{font-size:12px;color:var(--ink3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leghd .rg{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink3);white-space:nowrap}
/* leg band (Days list) with region art */
.legband{position:relative;overflow:hidden;border-radius:13px;min-height:64px;margin-bottom:10px;
  border:.5px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:11px 14px;
  background:linear-gradient(120deg, color-mix(in srgb,var(--accent) 18%,var(--card)) 0%, var(--card) 66%)}
.legband .scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:54px;color:var(--accent);opacity:.4;z-index:0;
  -webkit-mask-image:linear-gradient(to top,#000 48%,transparent);mask-image:linear-gradient(to top,#000 48%,transparent)}
.legband-t{position:relative;z-index:1;display:flex;align-items:baseline;gap:10px}
.legband-t .nm{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.015em}
.legband-t .rg{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink2);margin-left:auto;white-space:nowrap}
.legband-s{position:relative;z-index:1;font-size:12px;color:var(--ink2);margin-top:3px}
/* real-earth Leaflet map — colourful topographic (OpenTopoMap) */
.jmap-real{width:100%;height:320px;border-radius:14px;overflow:hidden;
  background:#e8dcc4;border:.5px solid var(--line);margin-bottom:14px;
  box-shadow:0 12px 30px -16px rgba(0,0,0,.6)}
.leaflet-container{background:#dfdac5!important;font-family:var(--sys)!important}
.leaflet-popup-content-wrapper{background:var(--card)!important;color:var(--ink)!important;
  border-radius:10px!important;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)!important;
  border:.5px solid var(--line)}
.leaflet-popup-tip{background:var(--card)!important;border:.5px solid var(--line)}
.leaflet-popup-content{margin:10px 14px!important;font-family:var(--sys)!important;
  font-size:13px!important;line-height:1.45!important;color:var(--ink)!important}
.leaflet-popup-content b{color:var(--dawn);font-weight:600;display:block;margin-bottom:2px}
.leaflet-popup-close-button{color:var(--ink3)!important}
.leaflet-control-attribution{background:rgba(255,255,255,.9)!important;color:#333!important;
  font-size:9px!important;padding:2px 6px!important}
.leaflet-control-attribution a{color:#0066cc!important}
/* pin: coloured to the leg accent, white outline for the light map */
.tp-pin{width:16px;height:16px;border-radius:50%;background:var(--pc,var(--dawn));
  border:2.5px solid #fff;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--pc,var(--dawn)) 80%,transparent),0 2px 6px rgba(0,0,0,.4)}
.tp-pin.active{background:var(--gold);border-color:#fff;
  box-shadow:0 0 0 3px rgba(217,164,65,.3),0 0 12px rgba(217,164,65,.7),0 2px 6px rgba(0,0,0,.4);
  animation:pinPulse 2s var(--ease) infinite;width:20px;height:20px;margin:-2px 0 0 -2px}
@keyframes pinPulse{0%,100%{box-shadow:0 0 0 3px rgba(217,164,65,.3),0 0 12px rgba(217,164,65,.7),0 2px 6px rgba(0,0,0,.4)}
  50%{box-shadow:0 0 0 8px rgba(217,164,65,.15),0 0 18px rgba(217,164,65,.8),0 2px 6px rgba(0,0,0,.4)}}
.leaflet-control-zoom{border:1px solid rgba(0,0,0,.15)!important;background:#fff!important;
  border-radius:8px!important;box-shadow:0 4px 12px rgba(0,0,0,.2)!important}
.leaflet-control-zoom a{background:#fff!important;color:#333!important;
  border-bottom-color:rgba(0,0,0,.1)!important}
.leaflet-control-zoom a:hover{background:#f0f0f0!important;color:#000!important}

/* route timeline — the journey card */
.card.route{padding:20px 18px}
.rlist{display:flex;flex-direction:column;gap:0;margin-top:4px}
.rstop{display:grid;grid-template-columns:24px 1fr;column-gap:14px;position:relative;
  padding:8px 4px 18px 0;text-align:left;background:none;border:0;color:inherit;
  font:inherit;width:100%;cursor:pointer}
.rstop:last-child{padding-bottom:2px}
.rdot{grid-column:1;grid-row:1/span 3;position:relative;width:24px;
  display:flex;align-items:flex-start;justify-content:center;padding-top:6px}
.rdot .rd-in{width:12px;height:12px;border-radius:50%;background:var(--bg);
  border:2px solid var(--ink3);transition:all .3s var(--ease);position:relative;z-index:2}
.rline{grid-column:1;grid-row:2/span 3;position:relative;width:24px;
  display:flex;justify-content:center}
.rline::before{content:"";position:absolute;top:-4px;bottom:-20px;width:2px;
  background:var(--line);border-radius:2px}
.rstop:last-child .rline::before{display:none}
.rbody{grid-column:2;grid-row:1/span 3;min-width:0}
.rhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rnm{font-family:var(--sys);font-size:17px;font-weight:600;color:var(--ink);
  letter-spacing:-.015em}
.rdt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em;
  text-transform:uppercase;margin-left:auto}
.rsub{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.4}
.rmeta{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.04em;
  margin-top:5px;display:inline-flex;align-items:center;gap:6px}
.rmeta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;flex:0 0 12px}

/* colourful state variants — every stop wears its leg's accent */
.rstop .rd-in{background:var(--sa,var(--fjord));border-color:var(--sa,var(--fjord))}
.rstop .rline::before{background:linear-gradient(to bottom,var(--sa,var(--fjord)) 0%,color-mix(in srgb,var(--sa,var(--fjord)) 45%,var(--line)) 100%)}
.rstop .rnm{color:var(--ink);border-left:3px solid var(--sa,var(--fjord));padding-left:10px;margin-left:-13px}
.rstop.done{opacity:.85}
.rstop.done .rd-in{filter:saturate(.6)}
.rstop.active .rd-in{background:var(--sa);border-color:var(--sa);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--sa) 20%,transparent),0 0 14px color-mix(in srgb,var(--sa) 60%,transparent)}
.rstop.active .rnm{color:var(--sa)}
.rstop.next .rd-in{border-color:var(--sa);background:var(--bg)}
.rstop.next .rnm{color:var(--ink)}
.rd-ring{position:absolute;top:6px;left:6px;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--sa,var(--dawn));animation:rring 2.2s var(--ease) infinite;z-index:1}
@keyframes rring{0%{opacity:.6;transform:scale(1)}70%{opacity:0;transform:scale(2.6)}100%{opacity:0;transform:scale(2.6)}}
.rstop.future{opacity:.85}
.rstop:hover{background:color-mix(in srgb,var(--sa,var(--fjord)) 4%,transparent)}
.rstop:active{transform:none}
.card.route{background:linear-gradient(160deg,var(--card) 0%,var(--bg2) 100%);
  border:.5px solid var(--line)}
.drow{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.drow:last-child{border-bottom:0}
.drow .dt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);width:44px;flex:0 0 44px;line-height:1.5;letter-spacing:.02em}
.drow .dt b{display:block;color:var(--ink2);font-size:14px;font-weight:600;letter-spacing:-.01em}
.drow .bd{flex:1;min-width:0}
.drow .ti{font-size:16px;font-weight:500;letter-spacing:-.018em;line-height:1.3}
.drow .st{font-size:12.5px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .ic{display:flex;gap:6px;align-items:center;color:var(--ink3)}
.drow .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.drow .go{color:var(--ink3);opacity:.55}
.drow .go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transform:rotate(180deg)}
.drow.now{background:rgba(79,214,156,.07);margin:0 -10px;padding:14px 10px;border-radius:12px;border-bottom:0}
.drow.now .ti{color:var(--dawn)}
.drow.now .pulse{width:7px;height:7px;border-radius:50%;background:var(--dawn);flex:0 0 7px;
  box-shadow:0 0 0 0 rgba(79,214,156,.5);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,214,156,.5)}70%{box-shadow:0 0 0 8px rgba(79,214,156,0)}100%{box-shadow:0 0 0 0 rgba(79,214,156,0)}}
.drow.past{opacity:.4}

/* ===== day timeline ===== */
.tl{position:relative;margin:16px 0 0;padding-left:30px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:14px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--dawn) 0%,var(--fjord) 32%,var(--gold) 62%,var(--dusk) 100%);
  opacity:.55}
.node{position:relative;margin-bottom:22px}
.node:last-child{margin-bottom:4px}
.node>.knob{position:absolute;left:-30px;top:2px;width:18px;height:18px;border-radius:50%;
  background:var(--bg);border:2px solid var(--pc,var(--fjord));display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px var(--bg),0 0 12px color-mix(in srgb,var(--pc,var(--fjord)) 55%,transparent)}
.node>.knob i{width:6px;height:6px;border-radius:50%;background:var(--pc,var(--fjord))}
.node .ph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pc,var(--fjord));display:flex;align-items:center;gap:7px;margin:0 0 9px;line-height:1}
.node .ph svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.node .ph .gh{margin-left:auto;display:inline-flex;align-items:center;gap:4px;letter-spacing:.04em;
  font-size:9.5px;padding:3px 8px;border-radius:7px;text-transform:none}
.node .ph .gh svg{width:12px;height:12px}
.gh-rise{background:rgba(79,214,156,.15);color:var(--dawn)}
.gh-set{background:rgba(232,168,96,.15);color:var(--dusk)}

/* blocks inside a node */
.blk{margin-bottom:12px}
.blk:last-child{margin-bottom:0}
.blk .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.blk .l svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 13px}
.blk .x{font-size:15px;line-height:1.55;color:var(--ink2)}
.blk strong{color:var(--ink);font-weight:600}
.blk em{font-style:normal;color:var(--accent);font-weight:500}
/* soft-card blocks for stops (café / market) */
.blk.soft{background:color-mix(in srgb,var(--pc,var(--fjord)) 7%,var(--card));
  border:.5px solid color-mix(in srgb,var(--pc,var(--fjord)) 18%,var(--line));
  border-radius:12px;padding:12px 13px}
.blk.soft .l{color:var(--pc)}
/* notes: tip / warn */
.blk.note{border-left:2px solid var(--line);padding-left:13px}
.blk.note .l,.blk.note .x{font-size:13px}
.blk.warn{border-left-color:var(--warn)}
.blk.warn .l{color:var(--warn)}

/* picks */
.picks{list-style:none;margin:11px 0 0;padding:0;display:grid;gap:8px}
.picks li{background:var(--card2);border:.5px solid var(--line);border-radius:11px;padding:11px 12px}
.picks .nm{font-weight:600;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.picks .ds{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.45}
.rate{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:2px 6px;
  border-radius:5px;white-space:nowrap}
.r-must{background:var(--dawn);color:#0B1116;font-weight:700}
.r-good{background:rgba(107,182,206,.18);color:var(--fjord)}
.r-if{background:rgba(255,255,255,.07);color:var(--ink3)}

/* day nav (prev/next) */
.daynav{display:flex;gap:8px;margin-top:18px}
.daynav button{flex:1;background:var(--card);border:.5px solid var(--line);border-radius:12px;
  padding:11px 12px;text-align:left;min-width:0}
.daynav button.nx{text-align:right}
.daynav .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.daynav .v{font-size:13px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== booking rows ===== */
.bk{display:flex;gap:12px;padding:13px 0;border-bottom:.5px solid var(--line);align-items:flex-start}
.bk:last-child{border-bottom:0}
.bk .w{font-family:var(--mono);font-size:10.5px;color:var(--ink3);width:56px;flex:0 0 56px;line-height:1.4;padding-top:2px}
.bk .b{flex:1;min-width:0}
.bk .n{font-weight:600;font-size:15px;letter-spacing:-.015em}
.bk .d{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.ref{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;
  color:var(--fjord);background:rgba(107,182,206,.1);padding:5px 10px;border-radius:8px;margin-top:8px;
  margin-right:6px;text-align:left;max-width:100%}
.ref svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;flex:0 0 12px}
.ref.addr{color:var(--gold);background:rgba(217,164,65,.10);white-space:normal;line-height:1.35}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:3px 7px;border-radius:5px;
  white-space:nowrap;align-self:flex-start;margin-top:2px}
.t-ok{background:rgba(79,214,156,.15);color:var(--dawn)}
.t-act{background:rgba(232,115,90,.16);color:var(--warn)}
.t-open{background:rgba(255,255,255,.06);color:var(--ink3)}
.grph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);margin:20px 0 2px;padding-bottom:7px;border-bottom:.5px solid var(--line)}
.grph:first-child{margin-top:0}

/* ===== segmented control ===== */
.seg{position:relative;display:flex;background:var(--bg2);border:.5px solid var(--line);
  border-radius:12px;padding:3px;margin:14px 0 6px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--card2);
  border:.5px solid var(--line);
  transform:translateX(calc(var(--n,0)*100%));transition:transform .3s var(--ease)}
.seg button{position:relative;z-index:1;flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;
  font-weight:500;color:var(--ink3);transition:color .2s}
.seg button.on{color:var(--ink)}

/* ===== stats strip (pre-trip hero enhancement) ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.stats .st{background:var(--card);border:.5px solid var(--line);border-radius:14px;
  padding:14px 12px;text-align:center;position:relative;overflow:hidden}
.stats .st .n{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1;
  letter-spacing:-.02em;
  background:linear-gradient(180deg,var(--ink),var(--accent) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.stats .st .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3);
  text-transform:uppercase;margin-top:5px}
.stats .st:nth-child(1){--accent:var(--dawn)}
.stats .st:nth-child(2){--accent:var(--fjord)}
.stats .st:nth-child(3){--accent:var(--gold)}
.stats .st::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5}
/* preview strip (upcoming legs) */
.preview{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:16px;
  margin-bottom:12px;box-shadow:0 12px 30px -18px rgba(0,0,0,.5)}
.preview .lab{margin:0 0 12px}
.plegs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -6px;
  scrollbar-width:none}
.plegs::-webkit-scrollbar{display:none}
.plegs .pl{flex:0 0 auto;padding:10px 14px;border-radius:11px;background:var(--card2);
  border:.5px solid var(--line);min-width:112px}
.plegs .pl .nm{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.plegs .pl .dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink3);
  margin-top:4px;text-transform:uppercase}
.plegs .pl .sb{font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.35}
.plegs .pl.on{border-color:var(--gold);background:linear-gradient(155deg,rgba(217,164,65,.14),var(--card2))}
/* long-form quote strip */
.epi{background:linear-gradient(160deg,rgba(107,182,206,.06),rgba(217,164,65,.04));
  border:.5px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:12px;
  position:relative}
.epi p{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink);
  margin:0;letter-spacing:-.01em}
.epi .att{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3);
  text-transform:uppercase;margin-top:12px;display:flex;align-items:center;gap:8px}
.epi .att::before{content:"";width:20px;height:1px;background:var(--ink3);opacity:.6}

/* ===== misc ===== */
.sect{margin-top:22px}
.sect h2{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.025em;margin:0 0 6px}
.sect .intro{font-size:14.5px;color:var(--ink2);margin:0 0 12px;line-height:1.5}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:14px;
  font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt td{padding:9px 6px 9px 0;border-bottom:.5px solid var(--line);vertical-align:top}
.lt td:first-child{font-family:var(--mono);font-size:11px;color:var(--ink3);width:52px}
.lt .tm{font-family:var(--mono);font-size:11.5px;width:46px}
.lt .r{color:var(--dawn)}.lt .s{color:var(--dusk)}
.lt td:last-child{color:var(--ink2)}
ul.pl{list-style:none;padding:0;margin:0}
ul.pl li{position:relative;padding:0 0 11px 16px;font-size:15px;color:var(--ink2);line-height:1.5}
ul.pl li::before{content:"";position:absolute;left:0;top:10px;width:7px;height:1px;background:var(--gold)}
ul.pl strong{color:var(--ink);font-weight:600}
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14.5px}

/* ===== motion ===== */
.fade{animation:f .32s var(--ease) both}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* directional view transitions (swipe / day nav) */
.anim-l{animation:slideL .34s var(--ease)}
.anim-r{animation:slideR .34s var(--ease)}
.anim-pop{animation:popIn .3s var(--ease)}
@keyframes slideL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.stagger{animation:f .4s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(6px);bottom:calc(92px + var(--safe-b));
  background:var(--card2);border:.5px solid var(--line);padding:10px 18px;border-radius:11px;
  font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.05s!important}
  .hero::before{animation:none}
}

/* ================================================================
   MAGAZINE COVER — pre-trip editorial hero
   Full-viewport photograph with a countdown that counts up on load,
   Ken-Burns pan, aurora shimmer, staggered typography reveal.
   ================================================================ */
.mag-cover{position:relative;overflow:hidden;margin:0 -18px 22px;
  min-height:min(88vh,720px);border-radius:0;isolation:isolate;
  color:#F5F1E8;letter-spacing:-.02em}
.mag-photo{position:absolute;inset:-4%;z-index:0;background-size:cover;background-position:center;
  animation:magPan 26s ease-in-out infinite alternate;will-change:transform;
  /* Anderson-style vintage-travel-poster stylization —
     heavy saturation, deep contrast, warm colour grade, subtle sepia */
  filter:saturate(1.55) contrast(1.28) brightness(1.02) sepia(.14) hue-rotate(-6deg)}
/* Warm colour-grade overlay — orange highlights up top, teal shadows below */
.mag-cover .mag-photo-grade{position:absolute;inset:0;z-index:1;pointer-events:none;
  mix-blend-mode:soft-light;opacity:.55;
  background:
    linear-gradient(180deg,
      rgba(240,140,60,.55) 0%,
      rgba(240,140,60,.0) 35%,
      rgba(20,80,100,.0) 60%,
      rgba(15,60,80,.5) 100%)}
/* Subtle paper-grain texture over the whole hero */
.mag-cover .mag-grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.08;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .05 0 0 0 0 .04 0 0 0 0 .02 0 0 0 1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
@keyframes magPan{
  0%{transform:scale(1.05) translate(-1%, 0)}
  100%{transform:scale(1.14) translate(2%, -1%)}
}
.mag-cover::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(11,15,19,.55) 0%, rgba(11,15,19,.15) 32%, rgba(11,15,19,.65) 72%, rgba(11,15,19,.95) 100%),
    radial-gradient(70% 55% at 50% 100%, rgba(11,15,19,.55), transparent 70%)}
/* animated aurora shimmer band across the middle */
.mag-cover::after{content:"";position:absolute;left:-10%;right:-10%;top:32%;height:38%;z-index:2;
  pointer-events:none;opacity:.6;filter:blur(28px);mix-blend-mode:screen;
  background:
    radial-gradient(60% 100% at 20% 50%, rgba(79,214,156,.4), transparent 65%),
    radial-gradient(50% 100% at 65% 50%, rgba(107,182,206,.35), transparent 60%),
    radial-gradient(45% 100% at 90% 50%, rgba(183,154,230,.28), transparent 60%);
  animation:magAurora 18s ease-in-out infinite alternate}
@keyframes magAurora{
  0%{transform:translate3d(-4%,-2%,0) scale(1.05);opacity:.45}
  50%{transform:translate3d(3%,1%,0) scale(1.15);opacity:.7}
  100%{transform:translate3d(6%,-1%,0) scale(1.08);opacity:.55}
}
/* the content column — everything left-aligned for consistent axis */
.mag-inner{position:relative;z-index:3;padding:56px 24px 60px;display:flex;flex-direction:column;
  min-height:inherit;justify-content:space-between;text-align:left;align-items:flex-start}
.mag-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(245,241,232,.7);animation:magIn .9s .1s var(--ease) both;
  padding-left:0;position:relative}
.mag-eyebrow::before{content:"";display:inline-block;width:28px;height:1px;
  background:rgba(245,241,232,.5);margin-right:12px;vertical-align:middle;margin-bottom:2px}
.mag-mid{margin-top:auto;width:100%}
/* countdown numeral — left-aligned, big but not extreme */
.mag-cd{display:flex;align-items:baseline;gap:14px;justify-content:flex-start;
  animation:magIn 1.1s .3s var(--ease) both;line-height:.85;margin-bottom:0}
.mag-cd-num{font-family:var(--sys);font-weight:800;font-size:clamp(112px,28vw,168px);
  letter-spacing:-.07em;font-variant-numeric:tabular-nums;line-height:.85;
  color:#F5F1E8;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.mag-cd-suffix{font-family:var(--sys);font-weight:500;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(245,241,232,.9);align-self:flex-end;padding-bottom:16px;
  line-height:1.25}
.mag-cd-suffix-sub{font-size:11px;color:rgba(245,241,232,.6);letter-spacing:.14em;font-weight:400}
/* title band — same left axis */
.mag-band{margin-top:28px;position:relative;padding-top:20px;width:100%;
  animation:magIn 1s .55s var(--ease) both}
.mag-band::before{content:"";position:absolute;top:0;left:0;width:64px;height:1px;
  background:linear-gradient(90deg,rgba(245,241,232,.85),transparent)}
.mag-title{font-family:var(--serif);font-size:clamp(38px,8.5vw,58px);font-weight:800;
  line-height:1;letter-spacing:-.03em;color:#F5F1E8;margin:0}
.mag-sub{font-family:var(--serif);font-size:14.5px;line-height:1.55;color:rgba(245,241,232,.82);
  margin:12px 0 0;max-width:520px;font-weight:400}
.mag-meta{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(245,241,232,.65);margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  animation:magIn 1s .8s var(--ease) both}
.mag-meta .dot{width:3px;height:3px;border-radius:50%;background:rgba(245,241,232,.5)}
/* scroll indicator */
.mag-scroll{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(245,241,232,.6);display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:magIn 1.2s 1.1s var(--ease) both,magBounce 2s 2s ease-in-out infinite}
.mag-scroll::after{content:"";width:1px;height:22px;
  background:linear-gradient(180deg,rgba(245,241,232,.7),transparent)}
@keyframes magBounce{0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(6px)}}
@keyframes magIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* chapter reel — horizontal scrolling table of contents */
.chapter-reel{margin:0 -18px 22px;padding:8px 0;position:relative}
.chapter-reel-title{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink3);padding:0 22px 12px;display:flex;align-items:center;gap:10px}
.chapter-reel-title::before{content:"";width:20px;height:1px;background:var(--ink3);opacity:.4}
.chapter-list{display:flex;gap:12px;overflow-x:auto;padding:2px 22px 20px;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chapter-list::-webkit-scrollbar{display:none}
.chapter{flex:0 0 82%;max-width:340px;height:440px;border-radius:20px;overflow:hidden;position:relative;
  scroll-snap-align:center;cursor:pointer;isolation:isolate;
  box-shadow:0 24px 60px -30px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.04) inset;
  border:.5px solid var(--line);transform:translateY(0);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.chapter:hover,.chapter:active{transform:translateY(-4px);
  box-shadow:0 30px 70px -30px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.06) inset}
.chapter-photo{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;
  transition:transform .8s var(--ease)}
.chapter:hover .chapter-photo{transform:scale(1.05)}
.chapter::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,transparent 30%,rgba(11,15,19,.5) 60%,rgba(11,15,19,.95) 100%)}
.chapter::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:3;
  background:linear-gradient(90deg,transparent,var(--ca,var(--fjord)) 25%,var(--ca,var(--fjord)) 75%,transparent);
  box-shadow:0 0 16px color-mix(in srgb,var(--ca,var(--fjord)) 70%,transparent)}
.chapter-body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px;color:#F5F1E8}
.chapter-no{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ca);opacity:.95;margin-bottom:10px}
.chapter-nm{font-family:var(--serif);font-size:30px;line-height:1.05;letter-spacing:-.025em;
  font-weight:700;color:#F5F1E8;margin:0}
.chapter-sub{font-size:13.5px;color:rgba(245,241,232,.8);margin-top:6px;line-height:1.4}
.chapter-dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(245,241,232,.65);margin-top:14px;padding-top:12px;
  border-top:.5px solid rgba(245,241,232,.15)}

/* reveal-on-scroll below-fold blocks */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.on{opacity:1;transform:none}

/* ===== dish dictionary ===== */
.dishes{display:grid;gap:8px;margin:6px 0 14px}
.dish{background:var(--card2);border:.5px solid var(--line);border-radius:12px;padding:12px 14px}
.dish .dn{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);
  letter-spacing:-.015em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dish .dg{font-family:var(--sys);font-size:11.5px;color:var(--ink3);font-weight:400}
.dish .dp{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:.06em;
  margin-top:2px}
.dish .dd{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5}

/* ===== compact inline sun-bar in the hero ===== */
.sunline{display:flex;align-items:center;gap:8px;margin-top:12px;
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink3)}
.sun-t{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.sun-t.rise{color:var(--dawn)}
.sun-t.set{color:var(--dusk)}
.sun-i{display:inline-flex;width:11px;height:11px}
.sun-i svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.sun-track{flex:1;height:2px;position:relative;border-radius:2px;min-width:40px;
  background:linear-gradient(90deg,var(--dawn) 0%,var(--gold) 50%,var(--dusk) 100%);opacity:.4}
.sun-dot{position:absolute;top:50%;transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 6px rgba(217,164,65,.6)}
.sun-dur{margin-left:auto;color:var(--gold);white-space:nowrap;flex:0 0 auto}
/* #6 moon phase pill (right of sun-bar or below) */
.moon-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:10px;letter-spacing:.06em;color:var(--ink3);margin-top:8px}
.moon-pill .moon-svg{width:14px;height:14px;flex:0 0 14px}
.moon-pill b{color:var(--ink2);font-weight:500}
.moon-pill .pct{color:var(--ink3);font-weight:400}

/* #5 live aurora Kp indicator inside the aurora-card */
.kp-live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.06em;margin-top:6px;padding:5px 10px;border-radius:8px;
  background:rgba(255,255,255,.06);color:var(--ink2)}
.kp-live .kp-dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);
  box-shadow:0 0 6px currentColor}
.kp-live.kp-low{color:var(--ink3)}
.kp-live.kp-mid{color:var(--dawn)} .kp-live.kp-mid .kp-dot{background:var(--dawn)}
.kp-live.kp-high{color:var(--gold)} .kp-live.kp-high .kp-dot{background:var(--gold)}
.kp-live.kp-storm{color:var(--warn)} .kp-live.kp-storm .kp-dot{background:var(--warn);
  animation:kpPulse 1.6s ease-in-out infinite}
@keyframes kpPulse{0%,100%{box-shadow:0 0 6px var(--warn)}50%{box-shadow:0 0 14px var(--warn)}}

/* #3 weather pill on day-list rows */
.wchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;
  letter-spacing:.04em;color:var(--ink3);flex:0 0 auto;margin-left:6px}
.wchip svg{width:14px;height:14px;flex:0 0 14px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.wchip.warm{color:var(--dusk)}
.wchip.cold{color:var(--fjord)}
.wchip.freeze{color:var(--alpine)}

/* ===== at-a-glance summary strip (day view) — compact ===== */
.glance-card{background:linear-gradient(160deg,var(--card) 0%,var(--bg2) 100%);
  border:.5px solid var(--line);border-radius:14px;padding:10px 10px 8px;margin:2px auto 14px;
  box-shadow:0 12px 30px -20px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.02) inset;
  position:relative;overflow:hidden;max-width:420px}
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g{position:relative;padding:9px 6px 8px;border-radius:11px;text-align:center;overflow:hidden;
  background:color-mix(in srgb,var(--gc,var(--fjord)) 5%,var(--card2));
  border:.5px solid color-mix(in srgb,var(--gc,var(--fjord)) 15%,var(--line))}
.g::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;
  background:radial-gradient(80% 60% at 50% -10%,color-mix(in srgb,var(--gc,var(--fjord)) 35%,transparent),transparent 70%)}
.g>*{position:relative;z-index:1}
.g.g-move{--gc:var(--fjord)}
.g.g-rise{--gc:var(--dawn)}
.g.g-set{--gc:var(--dusk)}
.g .g-icon{width:22px;height:22px;border-radius:50%;
  background:color-mix(in srgb,var(--gc) 18%,var(--card));
  border:.5px solid color-mix(in srgb,var(--gc) 35%,transparent);
  color:var(--gc);display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:5px;box-shadow:0 0 8px color-mix(in srgb,var(--gc) 22%,transparent)}
.g .g-icon svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.g .g-v{font-family:var(--sys);font-size:14px;font-weight:700;color:var(--ink);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .g-l{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin-top:3px}

/* sun arc — compact */
.sun-arc{margin-top:8px;padding-top:6px;border-top:.5px solid var(--line);text-align:center}
.sun-arc svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.sun-arc circle[fill*="sun-"]{filter:drop-shadow(0 0 4px rgba(217,164,65,.5))}
.daylight{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-top:2px}
.daylight span{color:var(--gold);font-weight:500}
.daylight b{color:var(--ink3);font-weight:400;font-size:8px;margin-left:1px}

/* ===== aurora teaser card ===== */
.aurora-card{background:linear-gradient(160deg,rgba(79,214,156,.12),rgba(107,182,206,.06));
  border:.5px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0;
  box-shadow:0 12px 30px -18px rgba(0,0,0,.5);position:relative;overflow:hidden}
.aurora-card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:radial-gradient(60% 100% at 50% 0%,rgba(79,214,156,.5),transparent 70%);
  filter:blur(20px);animation:aurora 12s ease-in-out infinite alternate}
.aurora-card>*{position:relative;z-index:1}
.aurora-card .lab{color:var(--dawn);margin-bottom:8px}
.aurora-card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 4px;
  letter-spacing:-.02em;color:var(--ink)}
.aurora-card p{font-size:13.5px;color:var(--ink2);margin:0 0 6px;line-height:1.5}
.aurora-card .kp{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10px;color:var(--dawn);letter-spacing:.08em;margin-top:6px;background:rgba(79,214,156,.14);
  padding:5px 10px;border-radius:8px}

/* ===== print CSS — a folder-ready day card ===== */
@media print{
  html,body{background:#fff!important;color:#111!important}
  body::before,.top,nav,.prog,.tab-ind,.toast,.aurora-card::before,.hero::before,
    .plegs,.stats,.epi,.preview,.actionsCard,.daynav{display:none!important}
  #app{padding:0!important}
  .wrap{max-width:none!important;padding:0!important}
  .hero{background:#fff!important;color:#111!important;border:1px solid #ccc!important;
    box-shadow:none!important;page-break-after:avoid}
  .hero h2,.hero .cd,.hero .eyebrow,.hero .stay,.hero .chip{color:#111!important;
    -webkit-text-fill-color:#111!important;background:none!important}
  .hero .scene{display:none!important}
  .card,.tl,.node,.blk,.jmap{background:#fff!important;color:#111!important;
    border-color:#ccc!important;box-shadow:none!important}
  .blk .x,.muted,.picks .ds{color:#333!important}
  .lab,.tiny,.blk .l,.node .ph{color:#666!important}
  a{color:#111!important;text-decoration:underline}
  h2,h3,strong{color:#111!important}
  .back,button{display:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div style="flex:1">
      <h1 id="tTitle">Arctic → Alpine</h1>
      <div class="sub" id="tSub">28 Sep – 18 Oct 2026</div>
    </div>
    <div class="pring" id="pring" title="Trip progress">
      <svg viewBox="0 0 34 34">
        <defs><linearGradient id="pgrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--dawn)"/>
          <stop offset="1" stop-color="var(--gold)"/>
        </linearGradient></defs>
        <circle class="pr-bg" cx="17" cy="17" r="14"/>
        <circle class="pr-fg" cx="17" cy="17" r="14"
          pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1" id="pringFg"/>
      </svg>
      <div class="pr-txt" id="pringTxt"></div>
    </div>
    <button id="btnSearch" aria-label="Search">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </div>
  <input class="srch" id="srch" placeholder="Search places, cafés, bookings…" style="display:none">
</header>
<div class="prog"><i id="progBar"></i></div>

<main id="app"><div class="wrap" id="view"></div></main>

<div class="toast" id="toast"></div>

<nav><div class="nav-in">
  <div class="tab-ind" id="tabInd"></div>
  <button class="tab on" data-v="today">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 19.4V22M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2 12h2.6M19.4 12H22M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/></svg>Today</button>
  <button class="tab" data-v="days">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Days</button>
  <button class="tab" data-v="book">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H18a1 1 0 011 1v16a1 1 0 01-1 1H6.5A2.5 2.5 0 014 18.5v-13zM4 17.5h15"/></svg>Bookings</button>
  <button class="tab" data-v="info">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.4"/></svg>Guide</button>
</div></nav>

<script src="data.js"></script>
<script src="covers.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
