<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Arctic → Alpine</title>
<meta name="theme-color" content="#0E1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arctic → Alpine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0D1216; --bg2:#141C21; --card:#1A242A; --card2:#202C33; --line:#28353C;
  --ink:#EAEEEF; --ink2:#94A5AC; --ink3:#5E7178;
  --dawn:#4FD69C; --dusk:#E0A45E; --fjord:#6BB6CE; --warn:#E8735A; --gold:#D9A441;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --serif:ui-serif,"New York",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --safe-t:env(safe-area-inset-top);
  --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sys);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}
#app{padding:calc(var(--safe-t) + 8px) 0 calc(76px + var(--safe-b))}
.wrap{padding:0 18px;max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:40;background:rgba(13,18,22,.82);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(var(--safe-t) + 10px) 18px 10px;border-bottom:.5px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:-.02em;flex:1}
.top .sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.srch{width:100%;background:var(--card);border:.5px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:15px;color:var(--ink);margin-top:10px;outline:none}
.srch::placeholder{color:var(--ink3)}

/* ===== tab bar ===== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(13,18,22,.9);backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:.5px solid var(--line);padding-bottom:var(--safe-b)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;
  color:var(--ink3);font-size:10px;letter-spacing:.01em;transition:color .18s}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--dawn)}

/* ===== hero ===== */
.hero{background:linear-gradient(155deg,#1B2A31 0%,#152026 60%,#141C21 100%);
  border-radius:16px;padding:20px;margin:14px 0}
.hero .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dusk)}
.hero h2{font-family:var(--serif);font-size:25px;line-height:1.15;margin:8px 0 12px;
  letter-spacing:-.025em;font-weight:600}
.hero .cd{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;
  letter-spacing:-.03em;margin:4px 0 2px}
.hero .cd small{font-size:15px;font-weight:400;color:var(--ink2);letter-spacing:0}

/* ===== chips ===== */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.07em;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.07);
  color:var(--ink2);white-space:nowrap}
.chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.chip.car{background:rgba(217,164,65,.16);color:var(--gold)}
.chip.nocar{opacity:.55}
.chip.fly{background:rgba(224,164,94,.16);color:var(--dusk)}
.chip.rail{background:rgba(79,214,156,.14);color:var(--dawn)}
.chip.rise{background:rgba(79,214,156,.12);color:var(--dawn)}
.chip.set{background:rgba(224,164,94,.12);color:var(--dusk)}

/* ===== cards ===== */
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px}
.card h3{font-size:14px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.lab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.muted{color:var(--ink2);font-size:15px}
.tiny{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink3)}

/* ===== day list ===== */
.daylist{margin-top:12px}
.drow{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.drow:last-child{border-bottom:0}
.drow .dt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);width:44px;flex:0 0 44px;line-height:1.5;letter-spacing:.02em}
.drow .bd{flex:1;min-width:0}
.drow .ti{font-size:16px;font-weight:500;letter-spacing:-.018em;line-height:1.3}
.drow .st{font-size:12.5px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .ic{display:flex;gap:5px;align-items:center;color:var(--ink3)}
.drow .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.drow.now{background:rgba(79,214,156,.07);margin:0 -12px;padding:13px 12px;border-radius:10px;border-bottom:0}
.drow.now .ti{color:var(--dawn)}
.drow.past{opacity:.45}

/* ===== day detail blocks ===== */
.blk{margin-bottom:14px}
.blk:last-child{margin-bottom:0}
.blk .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;margin-bottom:4px}
.blk .l svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 14px}
.blk .x{font-size:15.5px;line-height:1.55;color:var(--ink2)}
.blk em{font-style:normal;color:var(--fjord);font-weight:500}
.blk strong{color:var(--ink);font-weight:600}
.b-main .l{color:var(--fjord)}
.b-aft .l{color:var(--gold)}
.b-eve .l,.b-also .l{color:var(--ink3)}
.b-dawn,.b-dusk,.b-mkt,.b-cafe{border-radius:12px;padding:13px 14px}
.b-dawn{background:rgba(79,214,156,.10)}
.b-dawn .l{color:var(--dawn)}
.b-dusk{background:rgba(224,164,94,.10)}
.b-dusk .l{color:var(--dusk)}
.b-mkt{background:rgba(217,164,65,.08)}
.b-mkt .l{color:var(--gold)}
.b-cafe{background:rgba(107,182,206,.09)}
.b-cafe .l{color:var(--fjord)}
.b-tip,.b-warn{border-left:2px solid var(--line);padding-left:13px}
.b-tip .l,.b-tip .x{font-size:13.5px}
.b-warn{border-left-color:var(--warn)}
.b-warn .l{color:var(--warn)}
.b-warn .x{font-size:13.5px}

/* picks */
.picks{list-style:none;margin:10px 0 0;padding:0}
.picks li{padding:9px 0;border-top:.5px solid var(--line)}
.picks li:first-child{border-top:0;padding-top:4px}
.picks .nm{font-weight:600;font-size:14.5px;color:var(--ink)}
.picks .ds{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.45}
.rate{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:2px 6px;
  border-radius:5px;margin-left:7px;vertical-align:1.5px;white-space:nowrap}
.r-must{background:var(--dawn);color:#0B1116;font-weight:600}
.r-good{background:rgba(107,182,206,.18);color:var(--fjord)}
.r-if{background:rgba(255,255,255,.07);color:var(--ink3)}

/* ===== booking rows ===== */
.bk{display:flex;gap:12px;padding:13px 0;border-bottom:.5px solid var(--line);align-items:flex-start}
.bk:last-child{border-bottom:0}
.bk .w{font-family:var(--mono);font-size:10.5px;color:var(--ink3);width:56px;flex:0 0 56px;line-height:1.4;padding-top:2px}
.bk .b{flex:1;min-width:0}
.bk .n{font-weight:600;font-size:15px;letter-spacing:-.015em}
.bk .d{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.ref{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;
  color:var(--fjord);background:rgba(107,182,206,.1);padding:4px 9px;border-radius:7px;margin-top:7px}
.ref svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:3px 7px;border-radius:5px;
  white-space:nowrap;align-self:flex-start;margin-top:2px}
.t-ok{background:rgba(79,214,156,.15);color:var(--dawn)}
.t-act{background:rgba(232,115,90,.16);color:var(--warn)}
.t-open{background:rgba(255,255,255,.06);color:var(--ink3)}
.grph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);margin:20px 0 2px;padding-bottom:7px;border-bottom:.5px solid var(--line)}
.grph:first-child{margin-top:0}

/* ===== segmented control ===== */
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin:12px 0 4px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:12.5px;font-weight:500;
  color:var(--ink3);transition:all .18s}
.seg button.on{background:var(--card2);color:var(--ink)}

/* ===== misc ===== */
.sect{margin-top:22px}
.sect h2{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sect .intro{font-size:14.5px;color:var(--ink2);margin:0 0 12px;line-height:1.5}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--dawn);font-size:15px;margin-bottom:4px}
.back svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2}
.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt td{padding:9px 6px 9px 0;border-bottom:.5px solid var(--line);vertical-align:top}
.lt td:first-child{font-family:var(--mono);font-size:11px;color:var(--ink3);width:52px}
.lt .tm{font-family:var(--mono);font-size:11.5px;width:46px}
.lt .r{color:var(--dawn)}.lt .s{color:var(--dusk)}
.lt td:last-child{color:var(--ink2)}
ul.pl{list-style:none;padding:0;margin:0}
ul.pl li{position:relative;padding:0 0 11px 16px;font-size:15px;color:var(--ink2);line-height:1.5}
ul.pl li::before{content:"";position:absolute;left:0;top:10px;width:7px;height:1px;background:var(--gold)}
ul.pl strong{color:var(--ink);font-weight:600}
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14.5px}
.fade{animation:f .26s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe-b));
  background:var(--card2);border:.5px solid var(--line);padding:10px 18px;border-radius:10px;
  font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div style="flex:1">
      <h1 id="tTitle">Arctic → Alpine</h1>
      <div class="sub" id="tSub">30 Sep – 18 Oct 2026</div>
    </div>
    <button id="btnSearch" style="color:var(--ink3)">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </div>
  <input class="srch" id="srch" placeholder="Search places, cafés, bookings…" style="display:none">
</header>

<main id="app"><div class="wrap" id="view"></div></main>

<div class="toast" id="toast"></div>

<nav><div class="nav-in">
  <button class="tab on" data-v="today">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 19.4V22M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2 12h2.6M19.4 12H22M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/></svg>Today</button>
  <button class="tab" data-v="days">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Days</button>
  <button class="tab" data-v="book">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H18a1 1 0 011 1v16a1 1 0 01-1 1H6.5A2.5 2.5 0 014 18.5v-13zM4 17.5h15"/></svg>Bookings</button>
  <button class="tab" data-v="info">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.4"/></svg>Guide</button>
</div></nav>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
